[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lindsay Winkler", email = "lindsay@morphops.com" }
]
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.5",
    "psycopg[binary]>=3.2.13",
    "sqlmodel>=0.0.34",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.3",
]
